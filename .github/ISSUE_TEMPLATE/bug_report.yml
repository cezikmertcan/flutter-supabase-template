name: Bug report
description: Report a reproducible problem in the template.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: main@abc1234
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the smallest set of steps that demonstrates the issue.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets, tokens, URLs containing credentials, and personal data before posting.
      render: shell
